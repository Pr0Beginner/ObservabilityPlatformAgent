syntax = "proto3";

package observability.v1;

service IncidentContextService {
  rpc GetIncidentContext(IncidentContextRequest) returns (IncidentContextResponse);
}

message IncidentContextRequest {
  string incident_id = 1;
  int32 log_limit = 2;
}

message IncidentContextResponse {
  string incident_id = 1;
  string title = 2;
  string service = 3;
  string environment = 4;
  string severity = 5;
  string status = 6;
  string fingerprint = 7;
  repeated LogEvidence logs = 8;
  repeated string related_trace_ids = 9;
  string incident_type = 10;
  string operation = 11;
  string dimension = 12;
  optional double current_value = 13;
  optional double baseline_value = 14;
}

message LogEvidence {
  string id = 1;
  string timestamp = 2;
  string level = 3;
  string trace_id = 4;
  string message = 5;
  string fingerprint = 6;
  string span_id = 7;
  string parent_span_id = 8;
  string request_id = 9;
  string operation = 10;
  string span_kind = 11;
  optional int32 status_code = 12;
  optional bool success = 13;
  string error_code = 14;
  optional int64 duration_ms = 15;
}
